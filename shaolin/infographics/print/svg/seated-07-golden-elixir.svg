<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#000000" stroke-width="2"/>
  <style>
    text { font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", Arial, sans-serif; }
  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#000000">SEATED-METHOD TU-NA · EXERCISE 7</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#000000">Fire Refines the Golden Elixir</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#000000">火炼金丹</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#000000">SOURCE FIGURES 2-48—2-52</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#000000" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <image href="../base/seated-07-golden-elixir.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="273" r="25" fill="#000000"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NO EXPLICIT BREATH CUE</tspan></text>
        <text x="1220" y="332" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Outer foot edges meet, soles up, knees</tspan><tspan x="1220" dy="28">curved like a full moon; fingertips rub</tspan><tspan x="1220" dy="28">sole centers.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="637" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="637" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="680" r="25" fill="#000000"/>
        <text x="1233" y="688" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2A</text>
        <text x="1272" y="676" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE</tspan></text>
        <text x="1220" y="739" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Lift toes and gradually straighten legs;</tspan><tspan x="1220" dy="28">hands begin at Yongquan (KI1).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1044" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1044" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1087" r="25" fill="#000000"/>
        <text x="1233" y="1095" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2B</text>
        <text x="1272" y="1083" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">SAME INHALE PHASE</tspan></text>
        <text x="1220" y="1146" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Rub up inner-leg Kidney routes, past groin</tspan><tspan x="1220" dy="28">creases, to Mingmen (GV4) at the waist.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1451" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1451" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1494" r="25" fill="#000000"/>
        <text x="1233" y="1502" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3A</text>
        <text x="1272" y="1490" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NASAL EXHALE</tspan></text>
        <text x="1220" y="1553" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Rub along the Foot-Taiyang Bladder routes</tspan><tspan x="1220" dy="28">on the return.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1858" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1858" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1901" r="25" fill="#000000"/>
        <text x="1233" y="1909" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3B</text>
        <text x="1272" y="1897" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">SAME EXHALE PHASE</tspan></text>
        <text x="1220" y="1960" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Continue to Zhiyin (BL67) at the lateral</tspan><tspan x="1220" dy="28">tips of the fifth toes.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#000000"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#000000">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#000000"><tspan x="91" dy="0">Step 1 uncued · Step 2 = inhale, Yongquan→inner legs→Mingmen · Step 3 = exhale, Bladder route→Zhiyin</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#000000">Every breath phase is written explicitly in black; this edition does not require a color key.</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#000000">MONOCHROME PRINT EDITION · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>