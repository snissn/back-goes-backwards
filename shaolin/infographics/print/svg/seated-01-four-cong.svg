<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#000000" stroke-width="2"/>
  <style>
    text { font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", Arial, sans-serif; }
  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#000000">SEATED-METHOD TU-NA · EXERCISE 1</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#000000">Circulating the Four Cong Points</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#000000">四聪运转</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#000000">SOURCE FIGURES 2-30—2-31</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#000000" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <image href="../base/seated-01-four-cong.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="496" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="496" rx="5" fill="#000000"/>
        <circle cx="1233" cy="273" r="25" fill="#000000"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NO EXPLICIT BREATH CUE</tspan></text>
        <text x="1220" y="332" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Settle in half-lotus/single-cross-legged</tspan><tspan x="1220" dy="28">seat; palms on knees; upper body upright.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="739" width="558" height="496" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="739" width="9" height="496" rx="5" fill="#000000"/>
        <circle cx="1233" cy="782" r="25" fill="#000000"/>
        <text x="1233" y="790" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2A</text>
        <text x="1272" y="778" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">COORDINATE WITH TU-NA</tspan></text>
        <text x="1220" y="841" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Align palm Laogong (PC8) to crown Baihui</tspan><tspan x="1220" dy="28">(GV20); whole palm covers Sishencong</tspan><tspan x="1220" dy="28">(EX-HN1).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1248" width="558" height="496" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1248" width="9" height="496" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1291" r="25" fill="#000000"/>
        <text x="1233" y="1299" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2B</text>
        <text x="1272" y="1287" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">ONE DEEP, LONG BREATH PER FULL</tspan><tspan x="1272" dy="22">CIRCLE</tspan></text>
        <text x="1220" y="1372" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Overlap palms: men left underneath; women</tspan><tspan x="1220" dy="28">right underneath. Rotate left several</tspan><tspan x="1220" dy="28">circles, then right several.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1757" width="558" height="496" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1757" width="9" height="496" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1800" r="25" fill="#000000"/>
        <text x="1233" y="1808" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">AFTER</text>
        <text x="1272" y="1796" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">SLOW MOTION · DEEP, LONG BREATHING</tspan></text>
        <text x="1220" y="1859" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">After several rotations, press firmly on</tspan><tspan x="1220" dy="28">the crown several times.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#000000"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#000000">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#000000"><tspan x="91" dy="0">Every complete circle receives one deep, long breath. The source does NOT divide inhale/exhale between</tspan><tspan x="91" dy="35">halves of a circle.</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#000000">Every breath phase is written explicitly in black; this edition does not require a color key.</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#000000">MONOCHROME PRINT EDITION · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>