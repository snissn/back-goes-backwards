<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#000000" stroke-width="2"/>
  <style>
    text { font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", Arial, sans-serif; }
  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#000000">STANDING-METHOD TU-NA · PLATE 2 OF 5</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#000000">Standing Method · Steps 7–12</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#000000">站法吐纳功</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#000000">SOURCE FIGURES 2-7—2-12</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#000000" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <image href="../base/standing-02-steps-07-12.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="273" r="25" fill="#000000"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">7</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE</tspan></text>
        <text x="1220" y="332" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Externally rotate palms up; raise them</tspan><tspan x="1220" dy="28">before the armpits, fingertips forward;</tspan><tspan x="1220" dy="28">gaze ahead.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="569" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="569" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="612" r="25" fill="#000000"/>
        <text x="1233" y="620" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">8</text>
        <text x="1272" y="608" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">LONG NASAL EXHALE</tspan></text>
        <text x="1220" y="671" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Turn palms and push forward until</tspan><tspan x="1220" dy="28">wrists are shoulder-high; palms</tspan><tspan x="1220" dy="28">forward, fingertips up.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="908" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="908" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="951" r="25" fill="#000000"/>
        <text x="1233" y="959" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">9</text>
        <text x="1272" y="947" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">INHALE BEGINS</tspan></text>
        <text x="1220" y="1010" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Spread arms left/right at shoulder</tspan><tspan x="1220" dy="28">height; tiger’s mouths down, palms</tspan><tspan x="1220" dy="28">backward.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1247" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1247" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1290" r="25" fill="#000000"/>
        <text x="1233" y="1298" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">10</text>
        <text x="1272" y="1286" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="1349" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Curl hands into fists and draw them</tspan><tspan x="1220" dy="28">down to the waist; fist interiors up.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1586" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1586" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1629" r="25" fill="#000000"/>
        <text x="1233" y="1637" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">11</text>
        <text x="1272" y="1625" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">EXHALE BEGINS</tspan></text>
        <text x="1220" y="1688" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Open fists; arc palms up before</tspan><tspan x="1220" dy="28">forehead, palms down, fingers spread</tspan><tspan x="1220" dy="28">and facing.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1925" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1925" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1968" r="25" fill="#000000"/>
        <text x="1233" y="1976" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">12</text>
        <text x="1272" y="1964" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE EXHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="2027" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Press both palms down past the chest to</tspan><tspan x="1220" dy="28">the lower abdomen.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#000000"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#000000">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#000000"><tspan x="91" dy="0">7 inhale · 8 exhale · 9→10 one uninterrupted inhale · 11→12 one uninterrupted exhale</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#000000">Every breath phase is written explicitly in black; this edition does not require a color key.</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#000000">MONOCHROME PRINT EDITION · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>