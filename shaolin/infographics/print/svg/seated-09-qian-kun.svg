  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#000000">SEATED-METHOD TU-NA · EXERCISE 9</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#000000">Revolving Qian and Kun · Heaven and Earth</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#000000">旋转乾坤</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#000000">SOURCE FIGURES 2-55—2-61</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#000000" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <image href="../base/seated-09-qian-kun.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="273" r="25" fill="#000000"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="1272" y="269" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NASAL INHALE BEGINS</tspan></text>
        <text x="1220" y="332" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Raise palms forward/up, palms facing up.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="521" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="521" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="564" r="25" fill="#000000"/>
        <text x="1233" y="572" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
        <text x="1272" y="560" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="623" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Rotate while raising; form claws and</tspan><tspan x="1220" dy="28">press down at Jianjing (GB21).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="812" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="812" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="855" r="25" fill="#000000"/>
        <text x="1233" y="863" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
        <text x="1272" y="851" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NASAL EXHALE BEGINS</tspan></text>
        <text x="1220" y="914" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Open claws to palms; rub from armpits</tspan><tspan x="1220" dy="28">backward/down along Qihu (ST13).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1103" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1103" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1146" r="25" fill="#000000"/>
        <text x="1233" y="1154" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
        <text x="1272" y="1142" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE LONG EXHALE UNTIL FINISHED</tspan></text>
        <text x="1220" y="1205" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Hegu (LI4) to Shenshu (BL23); spread</tspan><tspan x="1220" dy="28">fingers, bow forward, extend arms back.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1394" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1394" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1437" r="25" fill="#000000"/>
        <text x="1233" y="1445" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">5</text>
        <text x="1272" y="1433" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NASAL INHALE BEGINS</tspan></text>
        <text x="1220" y="1496" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Arc palms from sides forward/up to chest;</tspan><tspan x="1220" dy="28">externally rotate palms up.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1685" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1685" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1728" r="25" fill="#000000"/>
        <text x="1233" y="1736" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">6</text>
        <text x="1272" y="1724" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE DEEP INHALE UNTIL FULL</tspan></text>
        <text x="1220" y="1787" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Bend elbows; palms inward, fingertips</tspan><tspan x="1220" dy="28">down; align PC8 toward Quze (PC3).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1976" width="558" height="278" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1976" width="9" height="278" rx="5" fill="#000000"/>
        <circle cx="1233" cy="2019" r="25" fill="#000000"/>
        <text x="1233" y="2027" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">7</text>
        <text x="1272" y="2015" font-size="18" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NASAL EXHALE</tspan></text>
        <text x="1220" y="2078" font-size="20" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Turn palms outward, spread fingers, push</tspan><tspan x="1220" dy="28">forward in a half-arc at Renzhong height.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#000000"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#000000">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#000000"><tspan x="91" dy="0">1→2 one uninterrupted inhale · 3→4 exhale to completion · 5→6 inhale to full · 7 exhale</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#000000">Every breath phase is written explicitly in black; this edition does not require a color key.</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#000000">MONOCHROME PRINT EDITION · Full bilingual wording: shaolin-exercises-translation.md</text>
