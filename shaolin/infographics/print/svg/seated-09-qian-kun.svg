<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#000000" stroke-width="2"/>
