  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#000000">SEATED-METHOD TU-NA · EXERCISE 3</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#000000">Descent of the Two Yang Channels</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#000000">双阳下降</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#000000">SOURCE FIGURES 2-36—2-40</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#000000" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <image href="../base/seated-03-two-yang.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="273" r="25" fill="#000000"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE BEGINS</tspan></text>
        <text x="1220" y="332" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Raise hands; press little-finger pads to</tspan><tspan x="1220" dy="28">Jingming (BL1) at inner eye corners.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="637" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="637" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="680" r="25" fill="#000000"/>
        <text x="1233" y="688" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
        <text x="1272" y="676" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE DEEP INHALE · NO</tspan><tspan x="1272" dy="22">INTERRUPTION</tspan></text>
        <text x="1220" y="761" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Move both palms upward over the crown.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1044" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1044" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1087" r="25" fill="#000000"/>
        <text x="1233" y="1095" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
        <text x="1272" y="1083" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING UNTIL FULL</tspan></text>
        <text x="1220" y="1146" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Trace down/back to Fengchi (GB20) at the</tspan><tspan x="1220" dy="28">base of the skull.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1451" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1451" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1494" r="25" fill="#000000"/>
        <text x="1233" y="1502" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
        <text x="1272" y="1490" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">LONG NASAL EXHALE BEGINS</tspan></text>
        <text x="1220" y="1553" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Turn palms inward and descend past the</tspan><tspan x="1220" dy="28">collarbones.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1858" width="558" height="394" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1858" width="9" height="394" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1901" r="25" fill="#000000"/>
        <text x="1233" y="1909" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">5</text>
        <text x="1272" y="1897" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">NO NEW CUE · PHYSICAL DESCENT</tspan><tspan x="1272" dy="22">CONTINUES</tspan></text>
        <text x="1220" y="1982" font-size="23" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Pass GB22, GB24, GB25, GB30 and continue to</tspan><tspan x="1220" dy="28">Zuqiaoyin (GB44). Do not strain.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#000000"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#000000">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#000000"><tspan x="91" dy="0">1→2→3 one continuous deep inhale to full · 4 begins a long exhale · 5 continues the route but supplies no</tspan><tspan x="91" dy="35">new breath phrase</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#000000">Every breath phase is written explicitly in black; this edition does not require a color key.</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#000000">MONOCHROME PRINT EDITION · Full bilingual wording: shaolin-exercises-translation.md</text>
