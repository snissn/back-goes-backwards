<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#000000" stroke-width="2"/>
  <style>
    text { font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", Arial, sans-serif; }
  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#000000">STANDING-METHOD TU-NA · PLATE 5 OF 5</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#000000">Standing Method · Steps 24–29</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#000000">站法吐纳功</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#000000">SOURCE FIGURES 2-24—2-29</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#000000" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <image href="../base/standing-05-steps-24-29.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="273" r="25" fill="#000000"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">24</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE BEGINS</tspan></text>
        <text x="1220" y="332" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Turn fists inward and withdraw to waist</tspan><tspan x="1220" dy="28">sides; fist interiors down.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="569" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="569" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="612" r="25" fill="#000000"/>
        <text x="1233" y="620" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">25</text>
        <text x="1272" y="608" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="671" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Lift fists before chest; fist faces</tspan><tspan x="1220" dy="28">oppose each other, interiors down.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="908" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="908" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="951" r="25" fill="#000000"/>
        <text x="1233" y="959" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">26</text>
        <text x="1272" y="947" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="1010" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Pull fists before shoulders while</tspan><tspan x="1220" dy="28">lifting both heels; support on balls of</tspan><tspan x="1220" dy="28">feet.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1247" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1247" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1290" r="25" fill="#000000"/>
        <text x="1233" y="1298" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">27</text>
        <text x="1272" y="1286" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">LONG NASAL EXHALE</tspan></text>
        <text x="1220" y="1349" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Slowly return fists to waist, interiors</tspan><tspan x="1220" dy="28">down; lower both heels.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1586" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1586" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1629" r="25" fill="#000000"/>
        <text x="1233" y="1637" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">28</text>
        <text x="1272" y="1625" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE</tspan></text>
        <text x="1220" y="1688" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Push fists forward at shoulder height;</tspan><tspan x="1220" dy="28">upper body leans slightly back, fist</tspan><tspan x="1220" dy="28">interiors up.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1925" width="558" height="326" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <rect x="1190" y="1925" width="9" height="326" rx="5" fill="#000000"/>
        <circle cx="1233" cy="1968" r="25" fill="#000000"/>
        <text x="1233" y="1976" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">29</text>
        <text x="1272" y="1964" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.2"><tspan x="1272" dy="0">LONG NASAL EXHALE → EVEN BREATH</tspan></text>
        <text x="1220" y="2027" font-size="21" font-weight="450" fill="#000000"><tspan x="1220" dy="0">Open fists, lower palms to sides; relax</tspan><tspan x="1220" dy="28">whole body, regulate breath until even,</tspan><tspan x="1220" dy="28">and close.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#000000"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#000000">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#000000"><tspan x="91" dy="0">24→25→26 one uninterrupted inhale · 27 exhale · 28 inhale · 29 exhale, then regulate breathing until even</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#000000">Every breath phase is written explicitly in black; this edition does not require a color key.</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#000000">MONOCHROME PRINT EDITION · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>