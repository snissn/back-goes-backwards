  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#7B6D5A">SEATED-METHOD TU-NA · EXERCISE 2</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#202320">Sun and Moon Shining Bright</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#9A3F2F">日月通明</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#7B6D5A">SOURCE FIGURES 2-32—2-35</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#B8AA94" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#EEE7D8" stroke="#C6B9A4" stroke-width="3"/>
  <image href="../../base/seated-02-sun-moon.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="496" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="496" rx="5" fill="#1B6C8E"/>
        <circle cx="1233" cy="273" r="25" fill="#1B6C8E"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE BEGINS</tspan></text>
        <text x="1220" y="332" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Palms lightly cover face; palm heels below</tspan><tspan x="1220" dy="28">cheekbones, palm centers over cheekbones.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="739" width="558" height="496" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="739" width="9" height="496" rx="5" fill="#1B6C8E"/>
        <circle cx="1233" cy="782" r="25" fill="#1B6C8E"/>
        <text x="1233" y="790" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
        <text x="1272" y="778" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING UNTIL FULL</tspan></text>
        <text x="1220" y="841" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Push palms upward like washing the face</tspan><tspan x="1220" dy="28">until middle fingers reach Qianding (GV21).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1248" width="558" height="496" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1248" width="9" height="496" rx="5" fill="#B44731"/>
        <circle cx="1233" cy="1291" r="25" fill="#B44731"/>
        <text x="1233" y="1299" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
        <text x="1272" y="1287" font-size="19" font-weight="800" fill="#B44731" letter-spacing="0.2"><tspan x="1272" dy="0">LONG NASAL EXHALE BEGINS</tspan></text>
        <text x="1220" y="1350" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Press and rub both palms downward over the</tspan><tspan x="1220" dy="28">face.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1757" width="558" height="496" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1757" width="9" height="496" rx="5" fill="#8B6B2E"/>
        <circle cx="1233" cy="1800" r="25" fill="#8B6B2E"/>
        <text x="1233" y="1808" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
        <text x="1272" y="1796" font-size="19" font-weight="800" fill="#8B6B2E" letter-spacing="0.2"><tspan x="1272" dy="0">NO NEW CUE · FOLLOWS DOWNWARD EXHALE</tspan><tspan x="1272" dy="22">PHASE</tspan></text>
        <text x="1220" y="1881" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">At Ruzhong (ST17), turn fingertips down;</tspan><tspan x="1220" dy="28">descend to Qichong (ST30), then rub abdomen</tspan><tspan x="1220" dy="28">horizontally.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FBF8F0" stroke="#C6B9A4" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#1B6C8E"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#1B6C8E">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#202320"><tspan x="91" dy="0">1→2 one inhale to full · 3 starts the exhale · 4 continues the downward movement with no new breath</tspan><tspan x="91" dy="35">wording · source: one EXHALE then one INHALE per repetition</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#5E5A53">Blue = inhale · cinnabar = exhale · green = natural · gray = no explicit cue · ochre = phase context only</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#746D62">Visual study aid · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>