  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#7B6D5A">SEATED-METHOD TU-NA · EXERCISE 10</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#202320">Azure Dragon Probes Its Head</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#9A3F2F">青龙探首</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#7B6D5A">SOURCE FIGURES 2-62—2-66</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#B8AA94" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#EEE7D8" stroke="#C6B9A4" stroke-width="3"/>
  <image href="../../base/seated-10-azure-dragon.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="326" rx="5" fill="#777066"/>
        <circle cx="1233" cy="273" r="25" fill="#777066"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#777066" letter-spacing="0.2"><tspan x="1272" dy="0">NO EXPLICIT BREATH CUE</tspan></text>
        <text x="1220" y="332" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Press palms behind waist at Shenshu</tspan><tspan x="1220" dy="28">(BL23) and Zhishi (BL52).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="569" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="569" width="9" height="326" rx="5" fill="#47705E"/>
        <circle cx="1233" cy="612" r="25" fill="#47705E"/>
        <text x="1233" y="620" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
        <text x="1272" y="608" font-size="19" font-weight="800" fill="#47705E" letter-spacing="0.2"><tspan x="1272" dy="0">BREATHE NATURALLY</tspan></text>
        <text x="1220" y="671" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Trace and press downward along the</tspan><tspan x="1220" dy="28">Foot-Taiyang Bladder route.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="908" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="908" width="9" height="326" rx="5" fill="#8B6B2E"/>
        <circle cx="1233" cy="951" r="25" fill="#8B6B2E"/>
        <text x="1233" y="959" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
        <text x="1272" y="947" font-size="19" font-weight="800" fill="#8B6B2E" letter-spacing="0.2"><tspan x="1272" dy="0">NO NEW CUE · NATURAL IS THE ONLY</tspan><tspan x="1272" dy="22">STATED PATTERN</tspan></text>
        <text x="1220" y="1032" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Bend waist/knees; follow outer-leg</tspan><tspan x="1220" dy="28">Gallbladder routes to feet; thumbs</tspan><tspan x="1220" dy="28">press Gongsun (SP4).</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1247" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1247" width="9" height="326" rx="5" fill="#8B6B2E"/>
        <circle cx="1233" cy="1290" r="25" fill="#8B6B2E"/>
        <text x="1233" y="1298" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
        <text x="1272" y="1286" font-size="19" font-weight="800" fill="#8B6B2E" letter-spacing="0.2"><tspan x="1272" dy="0">NO NEW BREATH CUE</tspan></text>
        <text x="1220" y="1349" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Reach head/torso forward; grip toes</tspan><tspan x="1220" dy="28">inward, then rub Yongquan (KI1) on</tspan><tspan x="1220" dy="28">soles.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1586" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1586" width="9" height="326" rx="5" fill="#8B6B2E"/>
        <circle cx="1233" cy="1629" r="25" fill="#8B6B2E"/>
        <text x="1233" y="1637" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">5</text>
        <text x="1272" y="1625" font-size="19" font-weight="800" fill="#8B6B2E" letter-spacing="0.2"><tspan x="1272" dy="0">NO NEW BREATH CUE</tspan></text>
        <text x="1220" y="1688" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Extend legs forward; draw hands back</tspan><tspan x="1220" dy="28">along inner legs.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1925" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1925" width="9" height="326" rx="5" fill="#8B6B2E"/>
        <circle cx="1233" cy="1968" r="25" fill="#8B6B2E"/>
        <text x="1233" y="1976" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">6</text>
        <text x="1272" y="1964" font-size="19" font-weight="800" fill="#8B6B2E" letter-spacing="0.2"><tspan x="1272" dy="0">NO NEW BREATH CUE</tspan></text>
        <text x="1220" y="2027" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Return hands past lower abdomen to</tspan><tspan x="1220" dy="28">waist; restore head/waist to the</tspan><tspan x="1220" dy="28">opening posture.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FBF8F0" stroke="#C6B9A4" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#B44731"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#B44731">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#202320"><tspan x="91" dy="0">Only one breath instruction appears: NATURAL TU-NA/BREATHING in Step 2. No later movement is assigned to</tspan><tspan x="91" dy="35">a specific inhale or exhale.</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#5E5A53">Blue = inhale · cinnabar = exhale · green = natural · gray = no explicit cue · ochre = phase context only</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#746D62">Visual study aid · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>