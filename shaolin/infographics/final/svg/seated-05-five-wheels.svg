        <text x="1272" y="1627" font-size="19" font-weight="800" fill="#B44731" letter-spacing="0.2"><tspan x="1272" dy="0">NASAL EXHALE</tspan></text>
        <text x="1220" y="1690" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Move inward/down through BL3, BL4, BL2; rub</tspan><tspan x="1220" dy="28">inner eye corners, then descend nose</tspan><tspan x="1220" dy="28">bridge.</tspan></text>
