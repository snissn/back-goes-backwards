  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#7B6D5A">SEATED-METHOD TU-NA · EXERCISE 5</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#202320">Circulation of the Five Wheels</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#9A3F2F">五轮运转</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#7B6D5A">SOURCE FIGURES 2-44—2-46</text>
