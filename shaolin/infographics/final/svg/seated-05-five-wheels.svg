        <text x="1272" y="269" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE BEGINS</tspan></text>
        <text x="1220" y="332" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Press sword fingers at Chengqi (ST1),</tspan><tspan x="1220" dy="28">directly below the eye sockets.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="909" width="558" height="666" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
