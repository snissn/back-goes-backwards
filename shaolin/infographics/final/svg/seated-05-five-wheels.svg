        <circle cx="1233" cy="952" r="25" fill="#1B6C8E"/>
        <text x="1233" y="960" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
        <text x="1272" y="948" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING UNTIL FULL</tspan></text>
        <text x="1220" y="1011" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Circle outward/up through GB1, Yuwei, TE23,</tspan><tspan x="1220" dy="28">EX-HN4, GB14 to Toulinqi (GB15).</tspan></text>
      </g>
