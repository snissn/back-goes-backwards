<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#F4EFE3"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#9E8F78" stroke-width="2"/>
  <style>
    text { font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", Arial, sans-serif; }
  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#7B6D5A">STANDING-METHOD TU-NA · PLATE 3 OF 5</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#202320">Standing Method · Steps 13–18</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#9A3F2F">站法吐纳功</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#7B6D5A">SOURCE FIGURES 2-13—2-18</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#B8AA94" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#EEE7D8" stroke="#C6B9A4" stroke-width="3"/>
  <image href="../../base/standing-03-steps-13-18.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="326" rx="5" fill="#1B6C8E"/>
        <circle cx="1233" cy="273" r="25" fill="#1B6C8E"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">13</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">INHALE BEGINS</tspan></text>
        <text x="1220" y="332" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Open arms left/right at shoulder</tspan><tspan x="1220" dy="28">height; palms up, fingertips outward.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="569" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="569" width="9" height="326" rx="5" fill="#1B6C8E"/>
        <circle cx="1233" cy="612" r="25" fill="#1B6C8E"/>
        <text x="1233" y="620" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">14</text>
        <text x="1272" y="608" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE INHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="671" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Arc both palms overhead and join them</tspan><tspan x="1220" dy="28">in prayer; fingertips up; gaze ahead.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="908" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="908" width="9" height="326" rx="5" fill="#B44731"/>
        <circle cx="1233" cy="951" r="25" fill="#B44731"/>
        <text x="1233" y="959" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">15</text>
        <text x="1272" y="947" font-size="19" font-weight="800" fill="#B44731" letter-spacing="0.2"><tspan x="1272" dy="0">LONG NASAL EXHALE</tspan></text>
        <text x="1220" y="1010" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Sink joined palms to nose height;</tspan><tspan x="1220" dy="28">elbows remain shoulder-high and arms</tspan><tspan x="1220" dy="28">form a half-arc.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1247" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1247" width="9" height="326" rx="5" fill="#1B6C8E"/>
        <circle cx="1233" cy="1290" r="25" fill="#1B6C8E"/>
        <text x="1233" y="1298" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">16</text>
        <text x="1272" y="1286" font-size="19" font-weight="800" fill="#1B6C8E" letter-spacing="0.2"><tspan x="1272" dy="0">DEEP NASAL INHALE</tspan></text>
        <text x="1220" y="1349" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Slowly rotate joined palms inward;</tspan><tspan x="1220" dy="28">fingertips align toward the nose,</tspan><tspan x="1220" dy="28">tiger’s mouths down.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1586" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1586" width="9" height="326" rx="5" fill="#B44731"/>
        <circle cx="1233" cy="1629" r="25" fill="#B44731"/>
        <text x="1233" y="1637" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">17</text>
        <text x="1272" y="1625" font-size="19" font-weight="800" fill="#B44731" letter-spacing="0.2"><tspan x="1272" dy="0">EXHALE BEGINS</tspan></text>
        <text x="1220" y="1688" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Separate palm heels; thumb tips face,</tspan><tspan x="1220" dy="28">index tips meet; push forward to</tspan><tspan x="1220" dy="28">straight arms.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1925" width="558" height="326" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1925" width="9" height="326" rx="5" fill="#B44731"/>
        <circle cx="1233" cy="1968" r="25" fill="#B44731"/>
        <text x="1233" y="1976" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">18</text>
        <text x="1272" y="1964" font-size="19" font-weight="800" fill="#B44731" letter-spacing="0.2"><tspan x="1272" dy="0">CONTINUE EXHALING · NO INTERRUPTION</tspan></text>
        <text x="1220" y="2027" font-size="21" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Separate hands sideways; wrists</tspan><tspan x="1220" dy="28">shoulder-high, vertical palms outward,</tspan><tspan x="1220" dy="28">fingertips up.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FBF8F0" stroke="#C6B9A4" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#1B6C8E"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#1B6C8E">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#202320"><tspan x="91" dy="0">13→14 one uninterrupted inhale · 15 exhale · 16 inhale · 17→18 one uninterrupted exhale</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#5E5A53">Blue = inhale · cinnabar = exhale · green = natural · gray = no explicit cue · ochre = phase context only</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#746D62">Visual study aid · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>