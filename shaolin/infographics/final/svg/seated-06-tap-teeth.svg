<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2600" viewBox="0 0 1800 2600">
  <rect width="1800" height="2600" fill="#F4EFE3"/>
  <rect x="24" y="24" width="1752" height="2552" rx="28" fill="none" stroke="#9E8F78" stroke-width="2"/>
  <style>
    text { font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", Arial, sans-serif; }
  </style>

  <text x="54" y="68" font-size="22" font-weight="800" letter-spacing="2.6" fill="#7B6D5A">SEATED-METHOD TU-NA · EXERCISE 6</text>
  <text x="54" y="146" font-size="58" font-weight="780" fill="#202320">Tap the Teeth Audibly</text>
  <text x="1747" y="86" text-anchor="end" font-family="Heiti-SC-Medium" font-size="40" font-weight="650" fill="#9A3F2F">叩齿有声</text>
  <text x="1747" y="137" text-anchor="end" font-size="20" font-weight="750" letter-spacing="1.3" fill="#7B6D5A">SOURCE FIGURE 2-47 + SUPPLEMENTARY VIEW</text>
  <line x1="52" y1="182" x2="1748" y2="182" stroke="#B8AA94" stroke-width="2"/>

  <rect x="52" y="230" width="1100" height="2025" rx="24" fill="#EEE7D8" stroke="#C6B9A4" stroke-width="3"/>
  <image href="../../base/seated-06-tap-teeth.png" x="64" y="242" width="1076" height="2001" preserveAspectRatio="xMidYMid meet"/>
  
      <g>
        <rect x="1190" y="230" width="558" height="666" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="230" width="9" height="666" rx="5" fill="#777066"/>
        <circle cx="1233" cy="273" r="25" fill="#777066"/>
        <text x="1233" y="281" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">SET</text>
        <text x="1272" y="269" font-size="19" font-weight="800" fill="#777066" letter-spacing="0.2"><tspan x="1272" dy="0">NO EXPLICIT BREATH CUE</tspan></text>
        <text x="1220" y="332" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Place both palms on the knees.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="909" width="558" height="666" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="909" width="9" height="666" rx="5" fill="#777066"/>
        <circle cx="1233" cy="952" r="25" fill="#777066"/>
        <text x="1233" y="960" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">TAP</text>
        <text x="1272" y="948" font-size="19" font-weight="800" fill="#777066" letter-spacing="0.2"><tspan x="1272" dy="0">NO EXPLICIT BREATH CUE</tspan></text>
        <text x="1220" y="1011" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">Tap upper and lower teeth together slowly,</tspan><tspan x="1220" dy="28">producing an audible clicking sound; do not</tspan><tspan x="1220" dy="28">grind.</tspan></text>
      </g>
      <g>
        <rect x="1190" y="1588" width="558" height="666" rx="20" fill="#FBF8F0" stroke="#D8CEBA" stroke-width="2"/>
        <rect x="1190" y="1588" width="9" height="666" rx="5" fill="#777066"/>
        <circle cx="1233" cy="1631" r="25" fill="#777066"/>
        <text x="1233" y="1639" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">REPEAT</text>
        <text x="1272" y="1627" font-size="19" font-weight="800" fill="#777066" letter-spacing="0.2"><tspan x="1272" dy="0">NO EXPLICIT BREATH CUE</tspan></text>
        <text x="1220" y="1690" font-size="23" font-weight="450" fill="#202320"><tspan x="1220" dy="0">The source says warmth and saliva should</tspan><tspan x="1220" dy="28">develop; if no warmth is felt, the taps may</tspan><tspan x="1220" dy="28">be doubled.</tspan></text>
      </g>

  <rect x="52" y="2295" width="1696" height="210" rx="22" fill="#FBF8F0" stroke="#C6B9A4" stroke-width="2"/>
  <rect x="52" y="2295" width="12" height="210" rx="6" fill="#B44731"/>
  <text x="91" y="2343" font-size="20" font-weight="850" letter-spacing="2" fill="#B44731">EXACT BREATH TIMELINE</text>
  <text x="91" y="2386" font-size="26" font-weight="620" fill="#202320"><tspan x="91" dy="0">The source assigns NO inhale/exhale timing to the tooth taps. Do not add one.</tspan></text>
  <text x="91" y="2478" font-size="17" fill="#5E5A53">Blue = inhale · cinnabar = exhale · green = natural · gray = no explicit cue · ochre = phase context only</text>
  <text x="1740" y="2549" text-anchor="end" font-size="16" fill="#746D62">Visual study aid · Full bilingual wording: shaolin-exercises-translation.md</text>
</svg>